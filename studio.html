<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --side:#20353a;--side-2:#182a2e;--side-line:#33484c;
    --side-ink:#e4ecec;--side-muted:#93a4a4;--side-sec:#a7b6b6;
    --bg:#f3f1ea;--panel:#ffffff;--line:#e3ddd0;--line-soft:#efeae0;
    --ink:#3a4a48;--ink-strong:#243b3d;--label:#8a8577;--muted:#9b9587;
    --accent:#2f5d54;--accent-dark:#244a43;--accent-soft:#e5ede9;
    --warn:#b98a2e;--warn-soft:#f6edd8;--danger:#b5544a;--danger-soft:#f6e4e1;
    --radius:4px;--serif:'Playfair Display',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  ::selection{background:var(--accent);color:#fff}
  a{color:var(--accent)}

  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--side)}
  .gate-card{background:#fff;border-radius:8px;padding:38px 36px;max-width:392px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .gate-logo{display:flex;justify-content:center;margin-bottom:18px}
  .gate-logo .mk{width:96px;height:96px;border-radius:14px;background:var(--side);display:flex;align-items:center;justify-content:center;font-size:44px}
  .gate-title{text-align:center;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink-strong);margin-bottom:4px;letter-spacing:.3px}
  .gate-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:24px}
  .gate-hint{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  .gate-hint a{color:var(--accent);font-weight:600;text-decoration:none}

  aside{width:248px;background:var(--side);position:fixed;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:20}
  .brand{padding:18px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:11px}
  .brand .mk{width:40px;height:40px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .brand .bn{font-family:var(--serif);font-weight:600;font-size:17px;color:#fff;line-height:1.1}
  .brand .bs{font-size:10px;color:var(--side-muted);letter-spacing:1.5px;text-transform:uppercase}
  .profile{padding:18px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:12px}
  .avatar{width:44px;height:44px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:16px;flex:none}
  .profile .pn{font-size:14px;color:#fff;font-weight:600}
  .profile .pw{font-size:11px;color:var(--side-muted);margin-top:1px}
  nav{flex:1;overflow-y:auto;padding-top:6px}
  .nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--side-sec);padding:16px 20px 8px;font-weight:700}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--side-ink);padding:11px 22px;font-size:14px;font-weight:500;transition:.13s;border-left:3px solid transparent}
  .nav-btn:hover{background:rgba(255,255,255,.05)}
  .nav-btn.on{background:var(--side-2);border-left-color:#7fb8a8;color:#fff;font-weight:600}
  .nav-count{margin-left:auto;font-size:11px;color:var(--side-muted);background:rgba(255,255,255,.06);padding:1px 8px;border-radius:10px}
  .side-foot{padding:14px 18px;border-top:1px solid var(--side-line)}

  main{margin-left:248px}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:15}
  .topbar .crumb{font-family:var(--serif);font-size:16px;color:var(--ink-strong)}
  .topbar .uchip{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink)}
  .topbar .uchip .av{width:32px;height:32px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
  .topbar .logout{margin-left:8px;font-size:12px;color:var(--muted);background:none;padding:6px 13px;border:1px solid var(--line);border-radius:20px}
  .topbar .logout:hover{color:var(--danger);border-color:var(--danger)}
  .wrap{padding:26px 28px 80px;max-width:1000px}

  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .pagehead h2{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink-strong);margin:0}
  .pagehead .sub{color:var(--muted);font-size:13px;margin-top:4px}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:20px;font-size:14px;font-weight:600;transition:.13s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm{padding:5px 13px;font-size:12px;font-weight:600;border-radius:20px;background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-sm:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm.danger:hover{border-color:var(--danger);color:var(--danger)}

  .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:24px;background:#fff}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:13px;top:11px;width:16px;height:16px;color:var(--muted)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:6px 14px;border-radius:20px;cursor:pointer;background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;min-height:130px}
  .card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(36,59,61,.08);transform:translateY(-1px)}
  .card .ct{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink-strong);margin-bottom:6px;line-height:1.3}
  .card .cs{font-size:13px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cf{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;background:var(--accent-soft);color:var(--accent-dark)}

  .doc-title{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink-strong);margin:0 0 8px;letter-spacing:.2px}
  .doc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:22px;align-items:center}
  .prose{font-size:15px;color:var(--ink)}
  .prose h3{font-family:var(--serif);font-size:19px;color:var(--ink-strong);margin:28px 0 12px;font-weight:600}
  .prose p{margin:0 0 12px}
  .info-grid{display:grid;grid-template-columns:170px 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:20px 0 8px;font-size:14px}
  .info-grid .k{background:var(--accent-soft);padding:11px 16px;font-weight:600;color:var(--accent-dark)}
  .info-grid .v{background:#fff;padding:11px 16px}
  .step{display:flex;gap:16px;margin-bottom:24px}
  .step .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums}
  .step .body{flex:1;min-width:0}
  .step .body h4{margin:4px 0 7px;font-size:16px;color:var(--ink-strong)}
  .step .body p{margin:0 0 12px}
  .step img{max-width:100%;border:1px solid var(--line);border-radius:6px;display:block}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--label);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;transition:.13s;resize:vertical}
  .field input::placeholder,.field textarea::placeholder{color:#bdb6a5}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .editor-step{border:1px solid var(--line);border-radius:6px;padding:15px;margin-bottom:14px;background:#fbfaf6}
  .es-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .es-head b{font-size:13px;color:var(--ink-strong)}
  .img-drop{border:2px dashed var(--line);border-radius:6px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
  .img-drop:hover{border-color:var(--accent);color:var(--accent)}
  .img-preview{position:relative;margin-top:8px}
  .img-preview img{max-width:100%;border-radius:6px;border:1px solid var(--line);display:block}
  .img-preview .rm{position:absolute;top:8px;right:8px}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--label);font-weight:600;padding:12px 18px;border-bottom:1px solid var(--line)}
  td{padding:13px 18px;border-bottom:1px solid var(--line-soft);font-size:14px}
  tbody tr:hover td{background:#faf8f2}
  .tag-admin{background:var(--accent-soft);color:var(--accent-dark)}
  .tag-staff{background:#efeae0;color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(42,58,77,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:8px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:90vh;display:flex;flex-direction:column}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink-strong);margin:0}
  .modal-head .x{background:none;font-size:24px;color:var(--muted);line-height:.6;padding:0 4px}
  .modal-head .x:hover{color:var(--ink)}
  .modal-body{padding:22px;overflow-y:auto}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:11px}

  .empty{text-align:center;color:var(--muted);padding:70px 20px}
  .empty .ico{font-size:44px;margin-bottom:12px;opacity:.5}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-strong);color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}

  @media(max-width:760px){
    aside{transform:translateX(-100%);transition:.2s}
    aside.open{transform:none}
    main{margin-left:0}
    .menu-toggle{display:inline-flex!important}
    .row2{grid-template-columns:1fr}
    .info-grid{grid-template-columns:120px 1fr}
  }
  .menu-toggle{display:none}

  /* ===== Studio additions ===== */
  .wrap.wide{max-width:1360px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:18px}
  .panel h3{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink-strong);margin:0 0 4px}
  .panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 16px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .nav-link{text-decoration:none}
  .st{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
  .st-draft{background:#efeae0;color:#7d7668}
  .st-review{background:var(--warn-soft);color:#8a6418}
  .st-approved{background:var(--accent-soft);color:var(--accent-dark)}
  .st-obsolete{background:var(--danger-soft);color:var(--danger)}
  .due{color:var(--danger);font-weight:600}
  .ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .ed-grid.nopreview{grid-template-columns:minmax(0,1fr)}
  .preview{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px 24px}
  .preview .pv-label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
  .ed-grid.nopreview .preview{display:none}
  .list-row{display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:6px;align-items:center;margin-bottom:7px}
  .list-row input{padding:8px 11px;border:1px solid var(--line);border-radius:4px;width:100%}
  .list-row .use{font-size:11px;color:var(--muted);min-width:64px;text-align:right}
  .grip{cursor:grab;color:var(--muted);user-select:none;padding:0 4px;font-size:15px}
  .info-row{display:grid;grid-template-columns:160px 1fr auto auto auto;gap:6px;margin-bottom:8px;align-items:start}
  .info-row input,.info-row textarea{padding:9px 12px;border:1px solid var(--line);border-radius:4px;width:100%;resize:vertical}
  .es-tools{display:flex;gap:5px;flex-wrap:wrap}
  .es-tools .btn-sm{padding:4px 9px}
  .editor-step.dragging{opacity:.4}
  .editor-step.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .img-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .savebar{position:sticky;bottom:0;background:rgba(243,241,234,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:12px 0;margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
  .savebar input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:20px}
  .banner{background:var(--warn-soft);border:1px solid #ead7ac;color:#6f5216;padding:11px 15px;border-radius:6px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hist{border-left:2px solid var(--line);padding-left:14px}
  .hist .h{margin-bottom:12px;font-size:13px}
  .hist .h .t{color:var(--muted);font-size:12px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .sw.on{box-shadow:0 0 0 2px var(--ink-strong)}
  .avatar-lg{width:88px;height:88px;border-radius:10px;background:var(--accent);color:#fff;font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
  .avatar img,.avatar-lg img,.topbar .uchip .av img,.mk img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar,.topbar .uchip .av,.brand .mk{overflow:hidden}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:13px 16px}
  .kpi .n{font-size:22px;font-weight:700;color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .kpi .l{font-size:12px;color:var(--muted)}
  .tbl-wrap{overflow-x:auto}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
  .check input{width:16px;height:16px;accent-color:var(--accent)}
  @media(max-width:1100px){.ed-grid{grid-template-columns:minmax(0,1fr)}.preview{position:static;max-height:none}}
  @media(max-width:760px){.row3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.info-row{grid-template-columns:1fr auto auto auto}.info-row>:nth-child(2){grid-column:1/-1;grid-row:2}}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, enableIndexedDbPersistence }
    from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDLxMOrLoTTESWObxljwlyHxfNHVIBPdWU",
    authDomain: "sdh-corsair.firebaseapp.com",
    projectId: "sdh-corsair",
    storageBucket: "sdh-corsair.firebasestorage.app",
    messagingSenderId: "305598118383",
    appId: "1:305598118383:web:aad634d6416d30d3235e1a"
  };
  const app = initializeApp(firebaseConfig);
  const fdb = getFirestore(app);
  try{ await enableIndexedDbPersistence(fdb); }catch(e){}

  // Separate document so it never touches the warehouse app's data
  const ref = doc(fdb, "app", "sop_data");

  window.FB = {
    async loadDoc(){ const s = await getDoc(ref); return s.exists()? s.data().json : null; },
    async saveDoc(jsonStr){ await setDoc(ref, { json: jsonStr, at: Date.now() }); },
    watch(cb){ onSnapshot(ref, s=>{ if(s.exists()) cb(s.data().json); }); }
  };
  window.dispatchEvent(new Event("fb-ready"));
</script>
<script>
/* ================= SOP STUDIO =================
   Separate page sharing the same Firestore document (app/sop_data) as index.html.
   New data is additive, so the Library page keeps working:
     DB.settings  – branding, categories, departments, SOP template
     user.dept / position / email / phone / avatar
     sop.dept / status / effectiveDate / reviewDate / tags / history[]            */

const DEFAULT_SETTINGS={
  siteName:'SOP Library', siteSub:'Internal Procedures', logo:'📚', accent:'#2f5d54',
  categories:["Standard Operating Procedure (SOP)","User Guide","Policy","Form / Template","Other"],
  departments:[], infoTemplate:['Purpose','Scope'], reviewMonths:12, hideDrafts:true
};
const STATUSES=[{k:'draft',label:'Draft'},{k:'review',label:'In Review'},{k:'approved',label:'Approved'},{k:'obsolete',label:'Obsolete'}];
const ACCENTS=['#2f5d54','#1f4e79','#0f6e8c','#5b4b8a','#8a3b3b','#b0632a','#3d5a2a','#3a4a48'];
const HISTORY_MAX=15;

let DB={sops:[],users:[],settings:{}};
let CURRENT=null, TAB='sops', activeId=null, mode='list', draft=null, dirty=false;
let listQ='', listStatus='', listCat='', showPreview=true, _lastSaved='', _pvTimer=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const clone=o=>JSON.parse(JSON.stringify(o));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function initials(n){return (n||'?').trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();}
function fmtDate(ts){if(!ts)return'';return new Date(ts).toLocaleDateString('en-GB');}
function fmtDT(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtISO(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return d&&m&&y?`${d}/${m}/${y}`:iso;}
function todayISO(){const d=new Date();return d.toISOString().slice(0,10);}
function addMonthsISO(iso,n){const d=iso?new Date(iso+'T00:00:00'):new Date();d.setMonth(d.getMonth()+Number(n||12));return d.toISOString().slice(0,10);}
function isImgUrl(v){return /^(https?:|data:image\/)/i.test(String(v||''));}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}}

function statusOf(d){return d.status||'approved';}
function statusBadge(k){const s=STATUSES.find(x=>x.k===k)||STATUSES[2];return `<span class="st st-${s.k}">${s.label}</span>`;}
function isOverdue(d){return d.reviewDate && statusOf(d)!=='obsolete' && d.reviewDate<todayISO();}

/* ---- image hosting (same ImgBB account as the Library page) ---- */
let IMGBB_KEY="d36df5b1ecefd786cdd5100331ca240b";
function compressToBlob(file,maxW=1400,quality=0.82){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error('toBlob failed')),'image/jpeg',quality);};
    img.onerror=rej;const fr=new FileReader();fr.onload=()=>img.src=fr.result;fr.onerror=rej;fr.readAsDataURL(file);
  });
}
async function uploadToImgbb(file,maxW){
  const blob=await compressToBlob(file,maxW||1400);
  const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
  const form=new FormData();form.append('image',dataUrl.split(',')[1]);
  const resp=await fetch('https://api.imgbb.com/1/upload?key='+encodeURIComponent(IMGBB_KEY),{method:'POST',body:form});
  const json=await resp.json();
  if(!json.success)throw new Error((json.error&&json.error.message)||'Upload failed');
  return json.data.url;
}
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept||'image/*';i.onchange=()=>res(i.files[0]||null);i.click();});}
async function hashPw(pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}

/* ---- permissions (identical rules to index.html) ---- */
function isAdmin(u){u=u||CURRENT;return !!(u&&u.role==='admin');}
function can(perm,u){u=u||CURRENT;if(!u)return false;if(u.role==='admin')return true;return !!(u.perms||{})[perm];}
function canEditSop(sop,u){u=u||CURRENT;if(!u||!sop)return false;if(u.role==='admin'||can('editAll',u))return true;return can('editOwn',u)&&sop.ownerId===u.id;}
function roleLabel(u){if(!u)return'';if(u.role==='admin')return'Administrator';return ['create','editOwn','editAll','delete'].some(k=>can(k,u))?'Editor':'Viewer';}

/* ---- data layer: always merge onto the latest server copy before saving ---- */
function fbReady(){return new Promise(res=>{if(window.FB)return res();window.addEventListener('fb-ready',()=>res(),{once:true});});}
function norm(){DB.users=DB.users||[];DB.sops=DB.sops||[];DB.settings=DB.settings||{};}
async function commit(mutator){
  try{const r=await window.FB.loadDoc();if(r){DB=JSON.parse(r);norm();}}catch(e){console.warn('refresh before save failed',e);}
  const result=mutator(DB);
  if(result===false)return false;
  const j=JSON.stringify(DB);
  if(j.length>1000000){toast('Data too large to save ('+Math.round(j.length/1024)+' KB). Use smaller / fewer images.');return false;}
  try{
    await window.FB.saveDoc(j);_lastSaved=j;
    if(CURRENT)CURRENT=DB.users.find(u=>u.id===CURRENT.id)||CURRENT;
    if(j.length>900000)toast('Warning: stored data is '+Math.round(j.length/1024)+' KB (limit ≈ 1 MB).');
    return true;
  }catch(e){
    console.error(e);
    const info=((e&&e.code)||'')+' '+((e&&e.message)||'');
    toast(/permission|insufficient/i.test(info)?'Database rules blocked the save — changes NOT stored.':'Could not save: '+((e&&e.message)||'unknown error'));
    return false;
  }
}
function startRealtime(){
  _lastSaved=JSON.stringify(DB);
  window.FB.watch(js=>{
    if(js===_lastSaved)return;_lastSaved=js;
    try{DB=JSON.parse(js);}catch(e){return;}norm();
    if(!CURRENT)return;
    CURRENT=DB.users.find(u=>u.id===CURRENT.id)||null;
    if(!CURRENT){logout();return;}
    applyTheme();
    if(mode!=='edit'&&!modalOpen())renderApp();   // never clobber an open editor
  });
}
(async function init(){
  await fbReady();
  try{const r=await window.FB.loadDoc();if(r)DB=JSON.parse(r);}catch(e){console.warn(e);}
  norm();applyTheme();startRealtime();
  const sid=ssGet('sop_uid');
  const u=sid&&DB.users.find(x=>x.id===sid);
  if(u){CURRENT=u;TAB=(location.hash==='#settings'&&isAdmin(u))?'settings':(location.hash==='#profile'?'profile':defaultTab());renderApp();}else renderGate();
})();
window.addEventListener('beforeunload',e=>{if(mode==='edit'&&dirty){e.preventDefault();e.returnValue='';}});

/* ---- theme / branding ---- */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function mix(hex,w){const n=parseInt(hex.slice(1),16);const f=c=>Math.round(c+(255-c)*w);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}
function applyTheme(acc){
  const a=/^#[0-9a-f]{6}$/i.test(acc||S().accent)?(acc||S().accent):DEFAULT_SETTINGS.accent;
  const r=document.documentElement.style;r.setProperty('--accent',a);r.setProperty('--accent-dark',shade(a,-24));r.setProperty('--accent-soft',mix(a,.88));
  document.title=S().siteName+' · Studio';
}
function logoHtml(v){v=v||S().logo;return isImgUrl(v)?`<img src="${esc(v)}" alt="">`:esc(v||'📚');}
function avatarHtml(u){return u&&isImgUrl(u.avatar)?`<img src="${esc(u.avatar)}" alt="">`:initials(u&&u.name);}

async function doLogin(){

}

/* ================= PROCEDURE LIST ================= */
function editableSops(){return DB.sops.filter(d=>canEditSop(d));}
function renderSopList(){
  $('crumb').textContent='Procedure Editor';$('wrap').className='wrap wide';
  const mine=editableSops();
  const all=DB.sops;
  const q=listQ.toLowerCase();
  const rows=all.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).filter(d=>{
    if(listStatus==='overdue'){if(!isOverdue(d))return false;}else if(listStatus&&statusOf(d)!==listStatus)return false;
    if(listCat&&d.category!==listCat)return false;
    if(!q)return true;
    return [d.title,d.summary,d.category,d.dept,d.ownerName,(d.tags||[]).join(' ')].join(' ').toLowerCase().includes(q);
  });
  const cnt=k=>all.filter(d=>statusOf(d)===k).length;
  const canAny=can('create')||mine.length;
  $('wrap').innerHTML=`
    <div class="pagehead"><div><h2>Procedure Editor</h2>
      <div class="sub">${canAny?`You can edit ${mine.length} of ${all.length} procedure(s).`:'You have view-only access. Ask an administrator for edit permission.'}</div></div>
      ${can('create')?`<button class="btn btn-primary" onclick="newSop()">＋ New Procedure</button>`:''}</div>
    <div class="kpis">
      <div class="kpi"><div class="n">${cnt('approved')}</div><div class="l">Approved</div></div>
      <div class="kpi"><div class="n">${cnt('review')}</div><div class="l">In review</div></div>
      <div class="kpi"><div class="n">${cnt('draft')}</div><div class="l">Draft</div></div>
      <div class="kpi"><div class="n" style="${all.some(isOverdue)?'color:var(--danger)':''}">${all.filter(isOverdue).length}</div><div class="l">Review overdue</div></div>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="lq" placeholder="Search title, department, tag, owner…" value="${esc(listQ)}"></div>
      <select id="ls" style="padding:9px 12px;border:1px solid var(--line);border-radius:20px;background:#fff">
        <option value="">All statuses</option>${STATUSES.map(s=>`<option value="${s.k}" ${listStatus===s.k?'selected':''}>${s.label}</option>`).join('')}
        <option value="overdue" ${listStatus==='overdue'?'selected':''}>Review overdue</option></select>
      <select id="lc" style="padding:9px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;max-width:240px">
        <option value="">All categories</option>${cats().map(c=>`<option ${listCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Title</th><th>Category</th><th>Department</th><th>Status</th><th>Ver.</th><th>Next review</th><th>Updated</th><th></th></tr></thead><tbody>
      ${rows.map(d=>`<tr>
        <td><b style="color:var(--ink-strong)">${esc(d.title||'(Untitled)')}</b><div style="font-size:12px;color:var(--muted)">${esc(d.ownerName||'')}</div></td>
        <td style="font-size:13px">${esc(d.category||'')}</td>
        <td style="font-size:13px">${esc(d.dept||'—')}</td>
        <td>${statusBadge(statusOf(d))}</td>
        <td style="font-variant-numeric:tabular-nums">${esc(d.version||'')}</td>
        <td style="font-size:13px" class="${isOverdue(d)?'due':''}">${d.reviewDate?fmtISO(d.reviewDate)+(isOverdue(d)?' ⚠':''):'—'}</td>
        <td style="font-size:13px">${fmtDate(d.updatedAt)}</td>
        <td style="text-align:right;white-space:nowrap">${canEditSop(d)?`<button class="btn-sm" onclick="editSop('${d.id}')">✎ Edit</button>`:`<a class="btn-sm" style="text-decoration:none" href="index.html">View</a>`}</td>
      </tr>`).join('')}</tbody></table></div>`

  const lq=$('lq');lq.oninput=e=>{listQ=e.target.value;const p=e.target.selectionStart;renderSopList();const n=$('lq');n.focus();n.setSelectionRange(p,p);};
  $('ls').onchange=e=>{listStatus=e.target.value;renderSopList();};
  $('lc').onchange=e=>{listCat=e.target.value;renderSopList();};
}

/* ================= EDITOR ================= */
function blankSop(){
  const s=S();
  return {title:'',category:cats()[0],dept:CURRENT.dept||'',version:'1.0',status:'draft',effectiveDate:'',reviewDate:'',tags:[],
    summary:'',info:(s.infoTemplate||[]).map(k=>({k,v:''})),steps:[{title:'',text:'',img:''}],notes:''};
}
function draftKey(){return 'sop_studio_draft_'+(activeId||'new')+'_'+CURRENT.id;}
function newSop(){if(!can('create')){toast('Permission denied');return;}activeId=null;draft=blankSop();openEditor();}
function editSop(id){const d=DB.sops.find(x=>x.id===id);if(!canEditSop(d)){toast('Permission denied');return;}activeId=id;draft=clone(d);openEditor();}
function openEditor(){
  draft.info=draft.info||[];draft.steps=draft.steps||[];draft.tags=draft.tags||[];draft.status=statusOf(draft);
  mode='edit';dirty=false;renderEditor();
}
function markDirty(){
  dirty=true;
  clearTimeout(_pvTimer);_pvTimer=setTimeout(()=>{updatePreview();lsSet(draftKey(),JSON.stringify({at:Date.now(),d:draft}));},250);
}
function cancelEdit(){
  if(dirty&&!confirm('Discard unsaved changes?'))return;
  lsDel(draftKey());draft=null;dirty=false;mode='list';activeId=null;renderSopList();
}

  ['title','version','summary','notes','effectiveDate','reviewDate'].forEach(k=>{$('f-'+k).oninput=e=>{draft[k]=e.target.value;markDirty();};});
  ['category','status','dept'].forEach(k=>{const el=$('f-'+k);el.oninput=el.onchange=e=>{draft[k]=e.target.value;markDirty();};});
  $('f-tags').oninput=e=>{draft.tags=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);markDirty();};

function togglePreview(){showPreview=!showPreview;$('edGrid').classList.toggle('nopreview',!showPreview);updatePreview();
  document.querySelector('.pagehead .btn-sm').textContent=(showPreview?'Hide':'Show')+' preview';}
function restoreLocal(){try{const l=JSON.parse(lsGet(draftKey()));draft=l.d;dirty=true;renderEditor();toast('Draft restored');}catch(e){toast('Could not restore');}}
function discardLocal(){lsDel(draftKey());$('restoreBar')?.remove();}
function bump(major){
  const p=String(draft.version||'1.0').split('.');let a=parseInt(p[0])||1,b=parseInt(p[1])||0;
  if(major){a++;b=0;}else b++;draft.version=a+'.'+b;$('f-version').value=draft.version;markDirty();
}

/* info rows */
function addInfo(){draft.info.push({k:'',v:''});renderInfoRows();markDirty();}
function applyTemplate(){const have=new Set(draft.info.map(r=>(r.k||'').toLowerCase()));
  (S().infoTemplate||[]).forEach(k=>{if(!have.has(k.toLowerCase()))draft.info.push({k,v:''});});renderInfoRows();markDirty();}
function moveArr(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;}
function infoAct(act,i){
  if(act==='up'&&!moveArr(draft.info,i,-1))return;if(act==='down'&&!moveArr(draft.info,i,1))return;
  if(act==='rm')draft.info.splice(i,1);
  renderInfoRows();markDirty();
}
function renderInfoRows(){

/* steps */
function addStep(){draft.steps.push({title:'',text:'',img:''});renderStepRows();markDirty();
  setTimeout(()=>{const els=document.querySelectorAll('#stepsWrap .editor-step');els[els.length-1]?.scrollIntoView({behavior:'smooth',block:'center'});},30);}
function stepAct(act,i){
  const st=draft.steps;
  if(act==='up'&&!moveArr(st,i,-1))return;
  if(act==='down'&&!moveArr(st,i,1))return;
  if(act==='dup')st.splice(i+1,0,clone(st[i]));
  if(act==='ins')st.splice(i+1,0,{title:'',text:'',img:''});
  if(act==='rm'){if((st[i].title||st[i].text||st[i].img)&&!confirm('Remove step '+(i+1)+'?'))return;st.splice(i,1);}
  renderStepRows();markDirty();
}
let dragFrom=null;
function renderStepRows(){
  const w=$('stepsWrap');
  w.innerHTML=draft.steps.map((s,i)=>`<div class="editor-step" data-i="${i}" tabindex="-1">
    <div class="es-head"><div style="display:flex;align-items:center;gap:6px"><span class="grip" title="Drag to reorder">⠿</span><b>Step ${i+1}</b></div>
      <div class="es-tools">
        <button class="btn-sm" title="Move up" onclick="stepAct('up',${i})">▲</button>
        <button class="btn-sm" title="Move down" onclick="stepAct('down',${i})">▼</button>
        <button class="btn-sm" title="Duplicate" onclick="stepAct('dup',${i})">⧉</button>
        <button class="btn-sm" title="Insert step below" onclick="stepAct('ins',${i})">＋</button>
        <button class="btn-sm danger" title="Remove" onclick="stepAct('rm',${i})">✕</button></div></div>
    <div class="field" style="margin-bottom:10px"><input data-i="${i}" data-f="title" value="${esc(s.title)}" placeholder="Step title"></div>
    <div class="field" style="margin-bottom:10px"><textarea data-i="${i}" data-f="text" rows="3" placeholder="Describe the action">${esc(s.text)}</textarea></div>
    <div class="imgcell" data-i="${i}"></div></div>`).join('')||'<p class="hint">No steps yet.</p>';
  w.querySelectorAll('input,textarea').forEach(el=>el.oninput=()=>{draft.steps[el.dataset.i][el.dataset.f]=el.value;markDirty();});
  w.querySelectorAll('.editor-step').forEach(card=>{
    const i=+card.dataset.i;
    card.querySelector('.grip').onmousedown=()=>card.draggable=true;
    card.ondragstart=e=>{dragFrom=i;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));};
    card.ondragend=()=>{card.draggable=false;card.classList.remove('dragging');w.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));};
    card.ondragover=e=>{if(dragFrom===null)return;e.preventDefault();card.classList.add('over');};
    card.ondragleave=()=>card.classList.remove('over');
    card.ondrop=e=>{e.preventDefault();if(dragFrom===null||dragFrom===i){dragFrom=null;return;}
      const [m]=draft.steps.splice(dragFrom,1);draft.steps.splice(i,0,m);dragFrom=null;renderStepRows();markDirty();};
    card.onpaste=e=>{const f=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(!f)return;e.preventDefault();doStepUpload(i,f.getAsFile());};
  });
  draft.steps.forEach((s,i)=>renderImgCell(i));
}
async function doStepUpload(i,file){
  const cell=document.querySelector(`.imgcell[data-i="${i}"]`);if(cell)cell.innerHTML='<div class="img-drop">Uploading…</div>';
  try{draft.steps[i].img=await uploadToImgbb(file);markDirty();toast('Image uploaded');}
  catch(e){toast('Image upload failed: '+e.message);}
  renderImgCell(i);
}
function renderImgCell(i){
  const cell=document.querySelector(`.imgcell[data-i="${i}"]`);if(!cell)return;const s=draft.steps[i];
  if(s.img){
    cell.innerHTML=`<div class="img-preview"><img src="${esc(s.img)}" alt=""></div>
      <div class="img-actions"><button class="btn-sm" data-a="rep">Replace</button><button class="btn-sm danger" data-a="rm">Remove image</button></div>`;
    cell.querySelector('[data-a=rm]').onclick=()=>{s.img='';renderImgCell(i);markDirty();};
    cell.querySelector('[data-a=rep]').onclick=async()=>{const f=await pickFile();if(f)doStepUpload(i,f);};
  }else{
    cell.innerHTML=`<div class="img-drop">📎 Click to upload, drop a file, or paste a screenshot</div>
      <div class="img-actions"><button class="btn-sm" data-a="url">Use image URL</button></div>`;
    const drop=cell.querySelector('.img-drop');
    drop.onclick=async()=>{const f=await pickFile();if(f)doStepUpload(i,f);};
    drop.ondragover=e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();e.stopPropagation();}};
    drop.ondrop=e=>{const f=e.dataTransfer.files[0];if(!f)return;e.preventDefault();e.stopPropagation();doStepUpload(i,f);};
    cell.querySelector('[data-a=url]').onclick=()=>{const u=prompt('Image URL (https://…)');if(u&&/^https?:\/\//i.test(u.trim())){s.img=u.trim();renderImgCell(i);markDirty();}};
  }
}

function docHtml(d){
  const info=(d.info||[]).filter(r=>r.k||r.v),steps=(d.steps||[]).filter(s=>s.title||s.text||s.img);
  return `<h1 class="doc-title" style="font-size:24px">${esc(d.title||'(Untitled)')}</h1>
    <div class="doc-meta">
      <span class="tag">${esc(d.category||'Other')}</span>${statusBadge(statusOf(d))}
      ${d.version?`<span>Version ${esc(d.version)}</span>`:''}${d.dept?`<span>${esc(d.dept)}</span>`:''}
      ${d.effectiveDate?`<span>Effective ${fmtISO(d.effectiveDate)}</span>`:''}${d.reviewDate?`<span>Review ${fmtISO(d.reviewDate)}</span>`:''}
    </div>
    ${d.summary?`<div class="prose"><p>${nl2br(d.summary)}</p></div>`:''}
    ${info.length?`<div class="info-grid">${info.map(r=>`<div class="k">${esc(r.k)}</div><div class="v">${nl2br(r.v)}</div>`).join('')}</div>`:''}
    ${steps.length?`<h3 class="prose">Procedure Steps</h3>`:''}
    ${steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div class="body">${s.title?`<h4>${esc(s.title)}</h4>`:''}${s.text?`<p>${nl2br(s.text)}</p>`:''}${s.img?`<img src="${esc(s.img)}" alt="">`:''}</div></div>`).join('')}
    ${d.notes?`<div class="prose"><h3>Notes</h3><p>${nl2br(d.notes)}</p></div>`:''}`;
}
function updatePreview(){const p=$('preview');if(p&&showPreview)p.innerHTML=`<div class="pv-label">Live preview</div>${docHtml(draft)}`;}

function snapshot(d){
  const keep=['title','category','dept','version','status','effectiveDate','reviewDate','tags','summary','info','steps','notes'];
  const o={};keep.forEach(k=>o[k]=clone(d[k]??''));
  // inline base64 images are large; keep only hosted URLs in history snapshots
  o.steps=(o.steps||[]).map(s=>({...s,img:/^https?:/i.test(s.img||'')?s.img:''}));
  return o;
}
function loadHistory(i){
  const orig=DB.sops.find(x=>x.id===activeId);const h=orig&&orig.history&&orig.history[i];if(!h||!h.snap)return;
  if(dirty&&!confirm('Replace your current unsaved edits with this version?'))return;
  const keepImgs=draft.steps;draft={...draft,...clone(h.snap)};
  draft.steps.forEach((s,k)=>{if(!s.img&&keepImgs[k]&&keepImgs[k].img&&!/^https?:/i.test(keepImgs[k].img))s.img=keepImgs[k].img;});
  dirty=true;renderEditor();toast('Version v'+(h.version||'?')+' loaded — review and Save to apply');
}
async function saveDraft(){
  draft.title=($('f-title').value||'').trim();
  if(!draft.title){toast('Please enter a title');$('f-title').focus();return;}
  const note=($('f-note').value||'').trim();
  const clean=clone(draft);
  clean.info=(clean.info||[]).filter(r=>r.k||r.v);
  clean.steps=(clean.steps||[]).filter(s=>s.title||s.text||s.img);
  const now=Date.now(),me=CURRENT,editingId=activeId;let newId=null;
  const ok=await commit(db=>{
    let target;
    if(editingId){
      const idx=db.sops.findIndex(s=>s.id===editingId);
      if(idx<0){toast('This procedure was deleted by someone else');return false;}
      if(!canEditSop(db.sops[idx],me)){toast('Permission denied');return false;}
      target={...db.sops[idx],...clean,updatedAt:now};db.sops[idx]=target;
    }else{
      if(!can('create',me)){toast('Permission denied');return false;}
      newId=uid();target={...clean,id:newId,createdAt:now,updatedAt:now,ownerId:me.id,ownerName:me.name};db.sops.push(target);
    }
    target.updatedById=me.id;target.updatedByName=me.name;
    target.history=(target.history||[]).concat([{at:now,by:me.id,byName:me.name,version:target.version,status:target.status,note:note||(editingId?'Updated':'Created'),snap:snapshot(target)}]).slice(-HISTORY_MAX);
  });
  if(!ok)return;
  lsDel(draftKey());if(newId)activeId=newId;
  draft=clone(DB.sops.find(x=>x.id===activeId));dirty=false;
  toast('Saved');renderEditor();
}
async function delSop(){
  if(!can('delete')){toast('Permission denied');return;}
  if(!confirm('Delete this procedure? This cannot be undone.'))return;
  const id=activeId;
  if(!await commit(db=>{db.sops=db.sops.filter(s=>s.id!==id);}))return;
  lsDel(draftKey());draft=null;dirty=false;activeId=null;mode='list';toast('Deleted');renderSopList();
}

  if(!SET.siteName.trim()){toast('Site name is required');return;}
  const renC=C.filter(r=>r.orig&&r.orig!==r.name),renD=D.filter(r=>r.orig&&r.orig!==r.name);
  const settings={siteName:SET.siteName.trim(),siteSub:SET.siteSub.trim(),logo:SET.logo||'📚',accent:SET.accent,
    categories:C.map(r=>r.name),departments:D.map(r=>r.name),infoTemplate:T.map(r=>r.name),reviewMonths:SET.reviewMonths,hideDrafts:SET.hideDrafts};
  const ok=await commit(db=>{
    db.settings=Object.assign({},db.settings||{},settings);
    renC.forEach(r=>db.sops.forEach(s=>{if(s.category===r.orig)s.category=r.name;}));
    renD.forEach(r=>{db.sops.forEach(s=>{if(s.dept===r.orig)s.dept=r.name;});db.users.forEach(u=>{if(u.dept===r.orig)u.dept=r.name;});});
  });
  if(ok){applyTheme();toast('Settings saved'+(renC.length+renD.length?' — renamed values updated':''));renderApp();}
}
function exportJson(){
  const data={exportedAt:new Date().toISOString(),settings:DB.settings,sops:DB.sops,
    users:DB.users.map(({pw,...u})=>u)};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='sop-backup-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

Object.assign(window,{$,doLogin,logout,go,newSop,editSop,cancelEdit,saveDraft,delSop,togglePreview,restoreLocal,discardLocal,bump,autoReview,
  addInfo,applyTemplate,infoAct,addStep,stepAct,loadHistory,uploadAvatar,clearAvatar,saveProfile,doChangePw,
  saveSettings,uploadLogo,leAct,exportJson,renderApp});
</script>
