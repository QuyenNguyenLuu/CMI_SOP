<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP & Procedure Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --side:#20353a;--side-2:#182a2e;--side-line:#33484c;
    --side-ink:#e4ecec;--side-muted:#93a4a4;--side-sec:#a7b6b6;
    --bg:#f3f1ea;--panel:#ffffff;--line:#e3ddd0;--line-soft:#efeae0;
    --ink:#3a4a48;--ink-strong:#243b3d;--label:#8a8577;--muted:#9b9587;
    --accent:#2f5d54;--accent-dark:#244a43;--accent-soft:#e5ede9;
    --warn:#b98a2e;--warn-soft:#f6edd8;--danger:#b5544a;--danger-soft:#f6e4e1;
    --radius:4px;--serif:'Playfair Display',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  ::selection{background:var(--accent);color:#fff}
  a{color:var(--accent)}

  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--side)}
  .gate-card{background:#fff;border-radius:8px;padding:38px 36px;max-width:392px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .gate-logo{display:flex;justify-content:center;margin-bottom:18px}
  .gate-logo .mk{width:96px;height:96px;border-radius:14px;background:var(--side);display:flex;align-items:center;justify-content:center;font-size:44px}
  .gate-title{text-align:center;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink-strong);margin-bottom:4px;letter-spacing:.3px}
  .gate-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:24px}
  .gate-hint{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  .gate-hint a{color:var(--accent);font-weight:600;text-decoration:none}

  aside{width:248px;background:var(--side);position:fixed;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:20}
  .brand{padding:18px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:11px}
  .brand .mk{width:40px;height:40px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .brand .bn{font-family:var(--serif);font-weight:600;font-size:17px;color:#fff;line-height:1.1}
  .brand .bs{font-size:10px;color:var(--side-muted);letter-spacing:1.5px;text-transform:uppercase}
  .profile{padding:18px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:12px}
  .avatar{width:44px;height:44px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:16px;flex:none}
  .profile .pn{font-size:14px;color:#fff;font-weight:600}
  .profile .pw{font-size:11px;color:var(--side-muted);margin-top:1px}
  nav{flex:1;overflow-y:auto;padding-top:6px}
  .nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--side-sec);padding:16px 20px 8px;font-weight:700}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--side-ink);padding:11px 22px;font-size:14px;font-weight:500;transition:.13s;border-left:3px solid transparent}
  .nav-btn:hover{background:rgba(255,255,255,.05)}
  .nav-btn.on{background:var(--side-2);border-left-color:#7fb8a8;color:#fff;font-weight:600}
  .nav-count{margin-left:auto;font-size:11px;color:var(--side-muted);background:rgba(255,255,255,.06);padding:1px 8px;border-radius:10px}
  .side-foot{padding:14px 18px;border-top:1px solid var(--side-line)}

  main{margin-left:248px}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:15}
  .topbar .crumb{font-family:var(--serif);font-size:16px;color:var(--ink-strong)}
  .topbar .uchip{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink)}
  .topbar .uchip .av{width:32px;height:32px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
  .topbar .logout{margin-left:8px;font-size:12px;color:var(--muted);background:none;padding:6px 13px;border:1px solid var(--line);border-radius:20px}
  .topbar .logout:hover{color:var(--danger);border-color:var(--danger)}
  .wrap{padding:26px 28px 80px;max-width:1000px}

  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .pagehead h2{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink-strong);margin:0}
  .pagehead .sub{color:var(--muted);font-size:13px;margin-top:4px}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:20px;font-size:14px;font-weight:600;transition:.13s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm{padding:5px 13px;font-size:12px;font-weight:600;border-radius:20px;background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-sm:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm.danger:hover{border-color:var(--danger);color:var(--danger)}

  .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:24px;background:#fff}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:13px;top:11px;width:16px;height:16px;color:var(--muted)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:6px 14px;border-radius:20px;cursor:pointer;background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;min-height:130px}
  .card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(36,59,61,.08);transform:translateY(-1px)}
  .card .ct{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink-strong);margin-bottom:6px;line-height:1.3}
  .card .cs{font-size:13px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cf{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;background:var(--accent-soft);color:var(--accent-dark)}

  .doc-title{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink-strong);margin:0 0 8px;letter-spacing:.2px}
  .doc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:22px;align-items:center}
  .prose{font-size:15px;color:var(--ink)}
  .prose h3{font-family:var(--serif);font-size:19px;color:var(--ink-strong);margin:28px 0 12px;font-weight:600}
  .prose p{margin:0 0 12px}
  .info-grid{display:grid;grid-template-columns:170px 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:20px 0 8px;font-size:14px}
  .info-grid .k{background:var(--accent-soft);padding:11px 16px;font-weight:600;color:var(--accent-dark)}
  .info-grid .v{background:#fff;padding:11px 16px}
  .step{display:flex;gap:16px;margin-bottom:24px}
  .step .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums}
  .step .body{flex:1;min-width:0}
  .step .body h4{margin:4px 0 7px;font-size:16px;color:var(--ink-strong)}
  .step .body p{margin:0 0 12px}
  .step img{max-width:100%;border:1px solid var(--line);border-radius:6px;display:block}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--label);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;transition:.13s;resize:vertical}
  .field input::placeholder,.field textarea::placeholder{color:#bdb6a5}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .editor-step{border:1px solid var(--line);border-radius:6px;padding:15px;margin-bottom:14px;background:#fbfaf6}
  .es-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .es-head b{font-size:13px;color:var(--ink-strong)}
  .img-drop{border:2px dashed var(--line);border-radius:6px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
  .img-drop:hover{border-color:var(--accent);color:var(--accent)}
  .img-preview{position:relative;margin-top:8px}
  .img-preview img{max-width:100%;border-radius:6px;border:1px solid var(--line);display:block}
  .img-preview .rm{position:absolute;top:8px;right:8px}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--label);font-weight:600;padding:12px 18px;border-bottom:1px solid var(--line)}
  td{padding:13px 18px;border-bottom:1px solid var(--line-soft);font-size:14px}
  tbody tr:hover td{background:#faf8f2}
  .tag-admin{background:var(--accent-soft);color:var(--accent-dark)}
  .tag-staff{background:#efeae0;color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(42,58,77,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:8px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:90vh;display:flex;flex-direction:column}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink-strong);margin:0}
  .modal-head .x{background:none;font-size:24px;color:var(--muted);line-height:.6;padding:0 4px}
  .modal-head .x:hover{color:var(--ink)}
  .modal-body{padding:22px;overflow-y:auto}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:11px}

  .empty{text-align:center;color:var(--muted);padding:70px 20px}
  .empty .ico{font-size:44px;margin-bottom:12px;opacity:.5}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-strong);color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}

  @media(max-width:760px){
    aside{transform:translateX(-100%);transition:.2s}
    aside.open{transform:none}
    main{margin-left:0}
    .menu-toggle{display:inline-flex!important}
    .row2{grid-template-columns:1fr}
    .info-grid{grid-template-columns:120px 1fr}
  }
  .menu-toggle{display:none}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, enableIndexedDbPersistence }
    from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAv8a7M3rWKYBw1bImPpB9JUyROb4y64q8",
    authDomain: "coco-cottage-kho.firebaseapp.com",
    projectId: "coco-cottage-kho",
    storageBucket: "coco-cottage-kho.firebasestorage.app",
    messagingSenderId: "690856050132",
    appId: "1:690856050132:web:5d2b071b578cd6a6daaa41"
  };
  const app = initializeApp(firebaseConfig);
  const fdb = getFirestore(app);
  try{ await enableIndexedDbPersistence(fdb); }catch(e){}

  // Separate document so it never touches the warehouse app's data
  const ref = doc(fdb, "app", "sop_data");

  window.FB = {
    async loadDoc(){ const s = await getDoc(ref); return s.exists()? s.data().json : null; },
    async saveDoc(jsonStr){ await setDoc(ref, { json: jsonStr, at: Date.now() }); },
    watch(cb){ onSnapshot(ref, s=>{ if(s.exists()) cb(s.data().json); }); }
  };
  window.dispatchEvent(new Event("fb-ready"));
</script>

/* ---- ImgBB image hosting ----
   Paste your ImgBB API key below. Get one free at https://api.imgbb.com/
   If left blank, the app will prompt for it and remember it in this browser. */
let IMGBB_KEY = "d36df5b1ecefd786cdd5100331ca240b";
function getImgbbKey(){
  if(IMGBB_KEY) return IMGBB_KEY;
  let k=null; try{ k=localStorage.getItem('imgbb_key'); }catch(e){}
  if(k) return k;
  k = prompt('Enter your ImgBB API key (get one free at https://api.imgbb.com/):');
  if(k){ k=k.trim(); try{ localStorage.setItem('imgbb_key', k); }catch(e){} }
  return k;
}
// compress large images before upload to save bandwidth/quota
function compressToBlob(file, maxW=1400, quality=0.82){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error('toBlob failed')),'image/jpeg',quality);
    };
    img.onerror=rej;
    const fr=new FileReader();fr.onload=()=>img.src=fr.result;fr.onerror=rej;fr.readAsDataURL(file);
  });
}
async function uploadToImgbb(file){
  const key=getImgbbKey();
  if(!key) throw new Error('No ImgBB API key provided');
  const blob=await compressToBlob(file);
  // ImgBB expects base64 (without the data: prefix) in the "image" field
  const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
  const base64=dataUrl.split(',')[1];
  const form=new FormData();
  form.append('image', base64);
  const resp=await fetch('https://api.imgbb.com/1/upload?key='+encodeURIComponent(key), {method:'POST', body:form});
  const json=await resp.json();
  if(!json.success){
    const msg=(json.error&&json.error.message)||'Upload failed';
    if(/invalid api key/i.test(msg)){ try{ localStorage.removeItem('imgbb_key'); }catch(e){} }
    throw new Error(msg);
  }
  return json.data.url;
}
async function hashPw(pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}

/* ---- permissions ----
   Each user has a perms object. Admin implicitly has all permissions. */
const PERM_DEFS=[
  {key:'view',   label:'View procedures'},
  {key:'create', label:'Create new procedures'},
  {key:'editOwn',label:'Edit own procedures'},
  {key:'editAll',label:'Edit all procedures'},
  {key:'delete', label:'Delete procedures'}
];
function defaultPerms(){return {view:true, create:false, editOwn:false, editAll:false, delete:false};}
function isAdmin(u){u=u||CURRENT;return !!(u&&u.role==='admin');}
function can(perm,u){
  u=u||CURRENT; if(!u) return false;
  if(u.role==='admin') return true;
  const p=u.perms||{};
  return !!p[perm];
}
function canEditSop(sop,u){
  u=u||CURRENT; if(!u) return false;
  if(u.role==='admin') return true;
  if(can('editAll',u)) return true;
  if(can('editOwn',u) && sop.ownerId===u.id) return true;
  return false;
}
function roleLabel(u){
  if(!u) return '';
  if(u.role==='admin') return 'Administrator';
  const granted=PERM_DEFS.filter(d=>d.key!=='view'&&can(d.key,u));
  if(granted.length) return 'Editor';
  return 'Viewer';
}

/* ---- Firebase bridge ---- */
function fbReady(){return new Promise(res=>{if(window.FB)return res();window.addEventListener('fb-ready',()=>res(),{once:true});});}
async function saveAll(){
  const j=JSON.stringify(DB);
  try{
    await window.FB.saveDoc(j);
    _lastSaved=j;
    return true;
  }catch(e){
    console.error('Firestore save failed:', e);
    const code=(e&&e.code)||'';
    if(/permission-denied|insufficient/i.test(code+' '+(e&&e.message||''))){
      alert('⚠ Cannot save to the database.\n\nFirestore Security Rules are blocking writes for this app.\n\nOpen Firebase Console → Firestore Database → Rules and allow read/write for document app/sop_data (see the deployment guide, Part F).');
    }else{
      toast('Could not save to the server: '+(e&&e.message||'unknown error'));
    }
    return false;
  }
}

(async function init(){
  await fbReady();
  let remote=null;
  try{ remote=await window.FB.loadDoc(); }catch(e){ console.warn(e); }
  if(remote){ try{ DB=JSON.parse(remote); }catch(e){} }
  DB.users=DB.users||[]; DB.sops=DB.sops||[];
  await ensureSeed();
  startRealtime();
  renderGate();
})();

async function ensureSeed(){
  let changed=false;
  if(!DB.users.length){
    DB.users=[
      {id:uid(),name:'Administrator',username:'admin',role:'admin',pw:await hashPw('admin'),perms:{view:true,create:true,editOwn:true,editAll:true,delete:true},createdAt:Date.now()},
      {id:uid(),name:'Viewer',username:'viewer',role:'staff',pw:await hashPw('viewer'),perms:defaultPerms(),createdAt:Date.now()}
    ];
    changed=true;
  }
  // ensure every user has a perms object (migration for older data)
  DB.users.forEach(u=>{ if(!u.perms){ u.perms = u.role==='admin' ? {view:true,create:true,editOwn:true,editAll:true,delete:true} : defaultPerms(); changed=true; } });
  if(!DB._seededSopEn){
    DB.sops=DB.sops.filter(s=>s.title!=='Set up User tự được approve PR sau khi tạo');
    if(!DB.sops.some(s=>s.title===SEED_SOP.title)){
      DB.sops.push({id:uid(),...SEED_SOP,createdAt:Date.now(),updatedAt:Date.now()});
    }
    DB._seededSopEn=true; changed=true;
  }
  if(changed) await saveAll();
}

function startRealtime(){
  _lastSaved=JSON.stringify(DB);
  window.FB.watch(jsonStr=>{
    if(jsonStr===_lastSaved) return;
    _lastSaved=jsonStr;
    try{ DB=JSON.parse(jsonStr); }catch(e){ return; }
    DB.users=DB.users||[]; DB.sops=DB.sops||[];
    if(CURRENT){
      CURRENT=DB.users.find(u=>u.id===CURRENT.id)||CURRENT;
      if(!modalOpen()) renderApp();
    }
  });
}

async function doRegister(){
  const name=$('rg-name').value.trim();
  const username=$('rg-user').value.trim().toLowerCase();
  const pass=$('rg-pass').value;
  const pass2=$('rg-pass2').value;
  if(!name||!username){toast('Enter your name and a username');return;}
  if(pass.length<4){toast('Password is too short');return;}
  if(pass!==pass2){toast('Passwords do not match');return;}
  if(DB.users.some(x=>x.username.toLowerCase()===username)){toast('Username already exists');return;}
  const nu={id:uid(),name,username,role:'staff',pw:await hashPw(pass),perms:defaultPerms(),createdAt:Date.now()};
  DB.users.push(nu);
  await saveAll();
  CURRENT=nu; gateMode='login'; TAB='library'; activeId=null; mode='view';
  toast('Account created — welcome!');
  renderApp();
}
async function doLogin(){
  const u=$('lg-user').value.trim().toLowerCase();
  const p=$('lg-pass').value;
  const f=DB.users.find(x=>x.username.toLowerCase()===u);
  if(!f){toast('Account not found');return;}
  if(f.pw!==await hashPw(p)){toast('Incorrect password');return;}
  CURRENT=f; TAB='library'; activeId=null; mode='view'; renderApp();
}

      ${tabs.map(t=>`<button class="nav-btn ${TAB===t.id?'on':''}" onclick="go('${t.id}')"><span>${t.ic}</span><span>${t.label}</span><span class="nav-count">${t.count}</span></button>`).join('')}
    </nav>
    <div class="side-foot"><button class="btn-sm" style="width:100%;color:var(--side-ink);border-color:var(--side-line)" onclick="changePw()">🔑 Change Password</button></div>
  </aside>
  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="menu-toggle btn-sm" onclick="document.getElementById('aside').classList.toggle('open')">☰</button>
        <div class="crumb" id="crumb">${TAB_TITLE[TAB]}</div>
      </div>
      <div class="uchip"><div class="av">${initials(CURRENT.name)}</div><span>${esc(CURRENT.name)}</span><button class="logout" onclick="logout()">Sign Out</button></div>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>`;
  if(TAB==='users')renderUsers(); else renderLibrary();
}
function go(t){TAB=t;activeId=null;mode='view';draft=null;renderApp();}

/* ================= LIBRARY ================= */
function filteredSops(){
  const q=searchQ.toLowerCase();
  return DB.sops.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).filter(d=>{
    if(activeCat&&d.category!==activeCat)return false;
    if(!q)return true;
    return ((d.title||'')+' '+(d.summary||'')+' '+(d.category||'')).toLowerCase().includes(q);
  });
}
function renderLibrary(){
  if(mode==='edit'){renderEditor();return;}
  if(activeId){renderViewer();return;}
  const cats=[...new Set(DB.sops.map(d=>d.category).filter(Boolean))];
  const items=filteredSops();
  $('crumb').textContent=TAB_TITLE.library;
  $('wrap').innerHTML=`
    <div class="pagehead">
      <div><h2>Procedure Library</h2><div class="sub">${DB.sops.length} document(s) · ${roleLabel(CURRENT)}${isAdmin()?' — full access':''}</div></div>
      ${can('create')?`<button class="btn btn-primary" onclick="newSop()">＋ New Procedure</button>`:''}
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="search" placeholder="Search procedures…" value="${esc(searchQ)}"></div>
      <div class="chips">
        <span class="chip ${activeCat===''?'on':''}" onclick="setCat('')">All</span>
        ${cats.map(c=>`<span class="chip ${activeCat===c?'on':''}" onclick="setCat('${esc(c)}')">${esc(c)}</span>`).join('')}
      </div>
    </div>
    ${items.length?`<div class="grid">${items.map(cardHtml).join('')}</div>`
      :`<div class="empty"><div class="ico">📭</div><p>${DB.sops.length?'No procedures match your filter.':'No procedures yet.'}</p>${can('create')&&!DB.sops.length?'<button class="btn btn-primary" onclick="newSop()" style="margin-top:10px">Create your first procedure</button>':''}</div>`}
  `;
  const s=$('search');
  s.oninput=e=>{searchQ=e.target.value;const pos=e.target.selectionStart;renderLibrary();const ns=$('search');ns.focus();ns.setSelectionRange(pos,pos);};
}
function cardHtml(d){
  const owner=d.ownerName?esc(d.ownerName):'';
  return `<div class="card" onclick="openSop('${d.id}')">
    <div class="ct">${esc(d.title||'(Untitled)')}</div>
    <div class="cs">${esc(d.summary||'No description')}</div>
    <div class="cf"><span class="tag">${esc(d.category||'Other')}</span><span>${owner?owner+' · ':''}${d.updatedAt?fmtDate(d.updatedAt):''}</span></div>
  </div>`;
}
function setCat(c){activeCat=c;renderLibrary();}
function openSop(id){activeId=id;mode='view';renderLibrary();}
function backToList(){activeId=null;mode='view';draft=null;renderLibrary();}

function renderViewer(){
  const d=findSop(activeId);
  if(!d){backToList();return;}
  $('crumb').textContent=(d.category||'Procedure')+' › '+(d.title||'');
  const info=(d.info||[]).filter(r=>r.k||r.v);
  const steps=d.steps||[];
  $('wrap').innerHTML=`
    <div style="margin-bottom:18px"><button class="btn-sm" onclick="backToList()">← Back</button></div>
    <div class="pagehead" style="align-items:flex-start">
      <div style="flex:1">
        <h1 class="doc-title">${esc(d.title)}</h1>
        <div class="doc-meta">
          <span class="tag">${esc(d.category||'Other')}</span>
          ${d.version?`<span>Version ${esc(d.version)}</span>`:''}
          ${d.ownerName?`<span>By ${esc(d.ownerName)}</span>`:''}
          ${d.updatedAt?`<span>Updated ${fmtDate(d.updatedAt)}</span>`:''}
        </div>
      </div>
      ${(canEditSop(d)||can('delete'))?`<div style="display:flex;gap:8px">${canEditSop(d)?`<button class="btn-sm" onclick="editSop()">✎ Edit</button>`:''}${can('delete')?`<button class="btn-sm danger" onclick="delSop('${d.id}')">🗑 Delete</button>`:''}</div>`:''}
    </div>
    ${d.summary?`<div class="prose"><p>${nl2br(d.summary)}</p></div>`:''}
    ${info.length?`<div class="info-grid">${info.map(r=>`<div class="k">${esc(r.k)}</div><div class="v">${nl2br(r.v)}</div>`).join('')}</div>`:''}
    ${steps.length?`<h3 class="prose">Procedure Steps</h3>`:''}
    ${steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div class="body">
      ${s.title?`<h4>${esc(s.title)}</h4>`:''}${s.text?`<p>${nl2br(s.text)}</p>`:''}
      ${s.img?`<img src="${imgSrc(s.img)}" alt="Step ${i+1} image">`:''}</div></div>`).join('')}
    ${d.notes?`<div class="prose"><h3>Notes</h3><p>${nl2br(d.notes)}</p></div>`:''}
  `;
}
async function delSop(id){
  if(!can('delete')){toast('Permission denied');return;}
  if(!confirm('Delete this procedure? This action cannot be undone.'))return;
  DB.sops=DB.sops.filter(s=>s.id!==id);
  activeId=null;mode='view';
  await saveAll(); toast('Deleted'); renderLibrary();
}

/* ================= EDITOR ================= */
function blankSop(){return{title:'',category:CATEGORIES[0],version:'1.0',summary:'',info:[{k:'Purpose',v:''},{k:'Scope',v:''}],steps:[{title:'',text:'',img:''}],notes:''};}
function newSop(){if(!can('create')){toast('Permission denied');return;}activeId=null;draft=blankSop();mode='edit';renderLibrary();}
function editSop(){const d=findSop(activeId);if(!canEditSop(d)){toast('Permission denied');return;}draft=JSON.parse(JSON.stringify(d));mode='edit';renderLibrary();}
function cancelEdit(){draft=null;mode='view';renderLibrary();}

function renderEditor(){
  $('crumb').textContent=activeId?'Edit Procedure':'New Procedure';
  $('wrap').innerHTML=`
    <div class="pagehead">
      <div><h2>${activeId?'Edit':'New'}</h2></div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button><button class="btn btn-primary" onclick="saveDraft()">💾 Save</button></div>
    </div>
    <div class="field"><label>Title *</label><input id="f-title" value="${esc(draft.title)}" placeholder="e.g. Set up a user to self-approve PRs"></div>
    <div class="row2">
      <div class="field"><label>Category</label><select id="f-cat">${CATEGORIES.map(c=>`<option ${c===draft.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Version</label><input id="f-ver" value="${esc(draft.version)}"></div>
    </div>
    <div class="field"><label>Overview / Description</label><textarea id="f-sum" rows="3" placeholder="Short description of the procedure's purpose">${esc(draft.summary)}</textarea></div>
    <div class="field"><label>Information table (Purpose, Scope, Owner…)</label><div id="infoWrap"></div><button class="btn-sm" onclick="addInfo()">＋ Add row</button></div>
    <div class="field"><label>Procedure Steps</label><div id="stepsWrap"></div><button class="btn-sm" onclick="addStep()">＋ Add step</button></div>
    <div class="field"><label>Notes</label><textarea id="f-notes" rows="3">${esc(draft.notes)}</textarea></div>
  `;
  bindField('f-title','title');bindField('f-ver','version');bindField('f-sum','summary');bindField('f-notes','notes');
  $('f-cat').onchange=e=>draft.category=e.target.value;
  renderInfoRows();renderStepRows();
}
function bindField(id,key){$(id).oninput=e=>draft[key]=e.target.value;}
function addInfo(){draft.info.push({k:'',v:''});renderInfoRows();}
function addStep(){draft.steps.push({title:'',text:'',img:''});renderStepRows();}
function renderInfoRows(){
  const w=$('infoWrap');
  w.innerHTML=draft.info.map((r,i)=>`<div style="display:grid;grid-template-columns:170px 1fr auto;gap:8px;margin-bottom:8px;align-items:start">
    <input data-i="${i}" data-f="k" value="${esc(r.k)}" placeholder="Label" style="padding:9px 12px;border:1px solid var(--line);border-radius:4px">
    <input data-i="${i}" data-f="v" value="${esc(r.v)}" placeholder="Value" style="padding:9px 12px;border:1px solid var(--line);border-radius:4px">
    <button class="btn-sm danger" onclick="rmInfo(${i})">✕</button></div>`).join('');
  w.querySelectorAll('input').forEach(el=>el.oninput=()=>draft.info[el.dataset.i][el.dataset.f]=el.value);
}
function rmInfo(i){draft.info.splice(i,1);renderInfoRows();}
function renderStepRows(){
  const w=$('stepsWrap');
  w.innerHTML=draft.steps.map((s,i)=>`<div class="editor-step">
    <div class="es-head"><b>Step ${i+1}</b><button class="btn-sm danger" onclick="rmStep(${i})">Remove step</button></div>
    <div class="field" style="margin-bottom:10px"><input data-i="${i}" data-f="title" value="${esc(s.title)}" placeholder="Step title"></div>
    <div class="field" style="margin-bottom:10px"><textarea data-i="${i}" data-f="text" rows="2" placeholder="Describe the action">${esc(s.text)}</textarea></div>
    <div class="imgcell" data-i="${i}"></div></div>`).join('');
  w.querySelectorAll('input,textarea').forEach(el=>el.oninput=()=>draft.steps[el.dataset.i][el.dataset.f]=el.value);
  draft.steps.forEach((s,i)=>renderImgCell(i));
}
function rmStep(i){draft.steps.splice(i,1);renderStepRows();}
function renderImgCell(i){
  const cell=document.querySelector(`.imgcell[data-i="${i}"]`);const s=draft.steps[i];
  if(s.img){
    cell.innerHTML=`<div class="img-preview"><img src="${imgSrc(s.img)}"><button class="btn-sm danger rm" style="background:#fff">Remove image</button></div>`;
    cell.querySelector('.rm').onclick=()=>{s.img='';renderImgCell(i);};
  }else{
    cell.innerHTML=`<div class="img-drop">📎 Click to upload an illustration</div><input type="file" accept="image/*" style="display:none">`;
    const inp=cell.querySelector('input');
    cell.querySelector('.img-drop').onclick=()=>inp.click();
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;cell.querySelector('.img-drop').textContent='Uploading…';
      try{ s.img=await uploadToImgbb(f); renderImgCell(i); }
      catch(e){ console.warn(e); toast('Image upload failed: '+e.message); renderImgCell(i); } };
  }
}
async function saveDraft(){
  const editingExisting=!!activeId;
  if(editingExisting){
    const existing=findSop(activeId);
    if(!canEditSop(existing)){toast('Permission denied');return;}
  }else{
    if(!can('create')){toast('Permission denied');return;}
  }
  draft.title=($('f-title').value||'').trim();
  if(!draft.title){toast('Please enter a title');return;}
  draft.info=draft.info.filter(r=>r.k||r.v);
  draft.steps=draft.steps.filter(s=>s.title||s.text||s.img);
  draft.updatedAt=Date.now();
  if(activeId){
    const idx=DB.sops.findIndex(s=>s.id===activeId);
    if(idx>=0) DB.sops[idx]={...DB.sops[idx],...draft};
  }else{
    draft.id=uid(); draft.createdAt=Date.now();
    draft.ownerId=CURRENT.id; draft.ownerName=CURRENT.name;
    DB.sops.push(draft); activeId=draft.id;
  }
  const big=JSON.stringify(DB).length;
  if(big>900000){ toast('Warning: data is getting large ('+Math.round(big/1024)+' KB). Consider fewer/smaller images.'); }
  draft=null;mode='view';
  await saveAll(); toast('Saved'); renderLibrary();
}

/* ================= USERS ================= */
function renderUsers(){
  if(!isAdmin()){go('library');return;}
  $('crumb').textContent=TAB_TITLE.users;
  $('wrap').innerHTML=`
    <div class="pagehead"><div><h2>User Management</h2><div class="sub">${DB.users.length} account(s)</div></div>
      <button class="btn btn-primary" onclick="userModal()">＋ Add User</button></div>
    <table><thead><tr><th>Full Name</th><th>Username</th><th>Role</th><th>Permissions</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${DB.users.map(u=>`<tr>
      <td><b style="color:var(--ink-strong)">${esc(u.name)}</b>${u.id===CURRENT.id?' <span style="color:var(--muted);font-size:12px">(you)</span>':''}</td>
      <td>${esc(u.username)}</td>
      <td><span class="tag ${u.role==='admin'?'tag-admin':'tag-staff'}">${roleLabel(u)}</span></td>
      <td style="font-size:12px;color:var(--muted)">${u.role==='admin'?'All permissions':(PERM_DEFS.filter(d=>can(d.key,u)).map(d=>d.label.replace(' procedures','').replace(' new','')).join(', ')||'None')}</td>
      <td style="text-align:right"><button class="btn-sm" onclick="userModal('${u.id}')">Edit</button> <button class="btn-sm danger" onclick="delUser('${u.id}')">Delete</button></td>
    </tr>`).join('')}</tbody></table>
    <div class="sub" style="margin-top:14px">Grant each user the exact permissions they need. <b>Administrator</b> has all permissions and can manage users. New self-registered accounts start as view-only.</div>
  `;
}
function openModal(title,bodyHtml,footHtml){
  $('overlay').innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${bodyHtml}</div><div class="modal-foot">${footHtml}</div></div>`;
  $('overlay').classList.add('show');
}
function closeModal(){$('overlay').classList.remove('show');$('overlay').innerHTML='';}
function userModal(id){
  const u=id?findUser(id):{name:'',username:'',role:'staff',perms:defaultPerms()};
  const perms=u.perms||defaultPerms();
  const permRows=PERM_DEFS.map(d=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;font-weight:400;cursor:pointer">
    <input type="checkbox" id="perm-${d.key}" ${perms[d.key]?'checked':''} style="width:16px;height:16px;accent-color:var(--accent)"> ${d.label}</label>`).join('');
  openModal(id?'Edit User':'Add User',`
    <div class="field"><label>Full Name *</label><input id="u-name" value="${esc(u.name)}"></div>
    <div class="field"><label>Username *</label><input id="u-username" value="${esc(u.username)}" ${id?'disabled style="opacity:.6"':''}></div>
    <div class="field"><label>Password ${id?'(leave blank to keep current)':'*'}</label><input id="u-pass" type="password" placeholder="${id?'••••••':'Enter password'}"></div>
    <div class="field"><label>Role</label><select id="u-role" onchange="onRoleChange()"><option value="staff" ${u.role==='staff'?'selected':''}>Standard user</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrator (all permissions)</option></select></div>
    <div class="field" id="perm-box" style="margin-bottom:0;${u.role==='admin'?'opacity:.4;pointer-events:none':''}"><label>Permissions</label>
      <div style="border:1px solid var(--line);border-radius:6px;padding:6px 14px;background:#fbfaf6">${permRows}</div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser('${id||''}')">Save</button>`);
  setTimeout(()=>$('u-name')?.focus(),50);
}
function onRoleChange(){
  const box=$('perm-box'); const isA=$('u-role').value==='admin';
  box.style.opacity=isA?'.4':'1'; box.style.pointerEvents=isA?'none':'auto';
}
async function saveUser(id){
  const name=$('u-name').value.trim();
  const username=$('u-username').value.trim().toLowerCase();
  const role=$('u-role').value;const pass=$('u-pass').value;
  if(!name||!username){toast('Enter full name and username');return;}
  if(!id&&!pass){toast('Enter a password');return;}
  if(!id&&DB.users.some(x=>x.username.toLowerCase()===username)){toast('Username already exists');return;}
  const perms={}; PERM_DEFS.forEach(d=>{ perms[d.key]=!!($('perm-'+d.key)&&$('perm-'+d.key).checked); });
  if(role!=='admin'&&!perms.view) perms.view=true; // everyone can at least view
  if(id){
    const u=findUser(id);
    if(u.role==='admin'&&role!=='admin'&&DB.users.filter(x=>x.role==='admin').length<=1){toast('At least one administrator is required');return;}
    u.name=name; u.role=role; u.perms=perms; if(pass)u.pw=await hashPw(pass);
  }else{
    DB.users.push({id:uid(),name,username,role,perms,pw:await hashPw(pass),createdAt:Date.now()});
  }
  closeModal(); await saveAll(); toast('Saved');
  if(TAB==='users')renderUsers();
}
async function delUser(id){
  const u=findUser(id);
  if(id===CURRENT.id){toast('You cannot delete the account you are signed in with');return;}
  if(u.role==='admin'&&DB.users.filter(x=>x.role==='admin').length<=1){toast('At least one administrator is required');return;}
  if(!confirm(`Delete user "${u.name}"?`))return;
  DB.users=DB.users.filter(x=>x.id!==id);
  await saveAll(); toast('Deleted');
  if(TAB==='users')renderUsers();
}

/* ================= CHANGE PASSWORD ================= */
function changePw(){
  openModal('Change Password',`
    <div class="field"><label>Current password</label><input id="cp-old" type="password" placeholder="••••••"></div>
    <div class="field"><label>New password</label><input id="cp-new" type="password" placeholder="At least 4 characters"></div>
    <div class="field" style="margin-bottom:0"><label>Confirm new password</label><input id="cp-new2" type="password" placeholder="••••••"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doChangePw()">Save</button>`);
}
async function doChangePw(){
  const o=$('cp-old').value,n=$('cp-new').value,n2=$('cp-new2').value;
  if(await hashPw(o)!==CURRENT.pw){toast('Current password is incorrect');return;}
  if(n.length<4){toast('New password is too short');return;}
  if(n!==n2){toast('Passwords do not match');return;}
  const u=findUser(CURRENT.id); const newHash=await hashPw(n); u.pw=newHash; CURRENT.pw=newHash;
  const ok=await saveAll();
  if(ok){ closeModal(); toast('Password changed'); }
  else { toast('Password NOT saved — see the error message'); }
}

window.doLogin=doLogin;window.logout=logout;window.go=go;window.setCat=setCat;window.openSop=openSop;
window.backToList=backToList;window.newSop=newSop;window.editSop=editSop;window.cancelEdit=cancelEdit;
window.delSop=delSop;window.saveDraft=saveDraft;window.addInfo=addInfo;window.rmInfo=rmInfo;
window.addStep=addStep;window.rmStep=rmStep;window.userModal=userModal;window.saveUser=saveUser;
window.delUser=delUser;window.closeModal=closeModal;window.changePw=changePw;window.doChangePw=doChangePw;
window.switchGate=switchGate;window.doRegister=doRegister;window.onRoleChange=onRoleChange;
</script>
